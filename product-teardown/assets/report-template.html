<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light;--ink:#172638;--muted:#526579;--line:#dbe3e9;--accent:#12695f;--soft:#eef7f4;--paper:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f6f7;color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow-wrap:anywhere}
main{max-width:1160px;margin:32px auto;padding:40px 48px;background:var(--paper);border:1px solid var(--line);border-radius:18px}header{padding-bottom:22px;border-bottom:1px solid var(--line)}.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:700}h1{font-size:34px;line-height:1.3;margin:8px 0 14px}h2{font-size:23px;line-height:1.45;margin:0 0 16px}h3{font-size:18px;margin:18px 0 10px}p{margin:10px 0}.meta,.caption,figcaption{color:var(--muted);font-size:14px}.lead{font-size:19px}.note{border-left:4px solid var(--accent);background:var(--soft);padding:12px 16px;border-radius:0 8px 8px 0}a{color:#075e78;text-underline-offset:3px}a:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid #76bdb0;outline-offset:3px}section{margin-top:30px;scroll-margin-top:18px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}nav a{padding:6px 12px;border:1px solid var(--line);border-radius:7px;text-decoration:none;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}.card{border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}.card h3{margin-top:0}.status{display:inline-block;padding:1px 8px;border:1px solid currentColor;border-radius:5px;font-size:12px;font-weight:600}.confirmed{color:#126149;background:#edf8f1}.uncertain{color:#695416;background:#fff8df}.verify{color:#884a20;background:#fff1e6}.suggestion{color:#3756a0;background:#eef3ff}
ul,ol{padding-left:24px}li{margin:6px 0}.table-wrap,.diagram{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:14px 0}table{width:100%;border-collapse:collapse;font-size:14px}caption{padding:10px 14px;text-align:left;color:var(--muted)}th,td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line);min-width:110px;overflow-wrap:anywhere}th{background:var(--soft);font-weight:650}tbody tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#fafcfc}
figure{margin:18px 0}img,svg{max-width:100%;height:auto}figure img{display:block;border:1px solid var(--line);border-radius:10px}figcaption{margin-top:8px}.diagram svg{display:block;min-width:600px;width:100%}.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;list-style:none;padding:0}.flow li{flex:1 1 170px;border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:8px;padding:12px;background:#fafdfc}.flow strong{display:block}
details{border:1px solid var(--line);border-radius:10px;margin:12px 0}summary{cursor:pointer;font-weight:650;padding:14px 16px}.detail-body{padding:0 16px 16px}.detail-body>:last-child{margin-bottom:0}pre{white-space:pre-wrap;word-break:break-word;background:#f4f7f9;padding:16px;border-radius:8px}code{font-size:.92em}footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media(max-width:700px){body{font-size:15px}main{margin:0;padding:24px 16px;border:0;border-radius:0}h1{font-size:27px}h2{font-size:21px}.lead{font-size:17px}.grid{grid-template-columns:1fr}th,td{padding:10px;min-width:105px}.card{padding:15px}}
@media print{html{scroll-behavior:auto}body{background:#fff;font-size:10.5pt}main{max-width:none;margin:0;padding:0;border:0}nav,.no-print{display:none!important}h1{font-size:23pt}h2{font-size:16pt;break-after:avoid}h3,summary{break-after:avoid}.grid{display:block}.card{margin:10px 0}.table-wrap,.diagram{overflow:visible;border-radius:0}table{font-size:9pt;table-layout:fixed}th,td{min-width:0;padding:7px;word-break:break-word}thead{display:table-header-group}tr,figure{break-inside:avoid}.diagram svg{min-width:0}details{break-inside:auto}details>summary{display:list-item!important}details>:not(summary){display:block!important}details::details-content{content-visibility:visible!important;height:auto!important}a{color:inherit}img{max-height:220mm;object-fit:contain}}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">产品拆解 · PRD 视角</div><h1>{{TITLE}}</h1><p class="meta">{{SUBTITLE}}</p></header>
{{BODY}}
<footer>本报告为基于所列材料与体验范围的逆向分析。事实、推断与建议以各项标记及来源为准。</footer>
</main>
</body>
</html>
